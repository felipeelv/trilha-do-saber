<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cidade do Saber — 1ª pessoa</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:dark}
  html,body{height:100%;overflow:hidden;background:#0a0d13;font-family:'Barlow',sans-serif;color:#edf0f5}
  #scene{position:fixed;inset:0}
  .overlay{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(5,8,14,.82);backdrop-filter:blur(6px);transition:opacity .3s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .card{
    text-align:center;max-width:440px;padding:34px 38px;
    background:rgba(13,18,26,.92);border:1px solid rgba(237,240,245,.14);border-radius:18px;
  }
  .card h1{font-family:'Bebas Neue';font-size:34px;letter-spacing:.06em;margin-bottom:6px}
  .card h1 em{font-style:normal;color:#ffc94d}
  .card p{font-size:14px;color:rgba(237,240,245,.6);font-weight:600;line-height:1.5;margin-bottom:18px}
  .keys{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
  .keys span{
    font-family:'Bebas Neue';font-size:13px;letter-spacing:.08em;
    border:1px solid rgba(237,240,245,.25);border-radius:6px;padding:4px 10px;color:rgba(237,240,245,.8);
  }
  .btn-go{
    font-family:'Bebas Neue';font-size:20px;letter-spacing:.08em;cursor:pointer;
    color:#0b0e13;background:linear-gradient(180deg,#ffc94d,#f0a32b);
    border:none;border-radius:12px;padding:12px 34px;
    box-shadow:0 4px 0 #b97b1e;
  }
  .btn-go:active{transform:translateY(2px);box-shadow:0 2px 0 #b97b1e}
  .hud{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;
    font-family:'Bebas Neue';font-size:15px;letter-spacing:.18em;text-transform:uppercase;
    background:linear-gradient(180deg,#3a8f3e,#1f5c25);padding:5px 22px;border-radius:4px;
    border:1px solid rgba(255,255,255,.3);box-shadow:0 4px 12px rgba(0,0,0,.55);
  }
  .back{
    position:fixed;top:10px;left:12px;z-index:10;text-decoration:none;
    font-family:'Bebas Neue';font-size:14px;letter-spacing:.12em;color:#edf0f5;
    background:rgba(13,18,26,.85);border:1px solid rgba(237,240,245,.2);border-radius:8px;padding:7px 14px;
  }
  .back:hover{border-color:#ffc94d;color:#ffc94d}
  .crosshair{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;
    width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 0 6px rgba(0,0,0,.8);pointer-events:none;
  }
  #prompt{
    position:fixed;bottom:8vh;left:50%;transform:translateX(-50%);z-index:10;
    font-family:'Bebas Neue';font-size:18px;letter-spacing:.08em;
    background:rgba(13,18,26,.9);border:1px solid #ffc94d;color:#edf0f5;
    border-radius:10px;padding:9px 22px;pointer-events:none;
  }
  #prompt b{color:#ffc94d}
  .quiz-card{max-width:520px;width:min(520px,92vw);text-align:left;max-height:88vh;overflow-y:auto}
  .quiz-card h2{font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em;margin-bottom:8px}
  .qmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(237,240,245,.55);margin-bottom:12px}
  .qtext{font-family:'Barlow',sans-serif;font-size:16.5px;font-weight:700;line-height:1.45;margin-bottom:16px}
  .qopt{
    display:flex;gap:11px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:rgba(237,240,245,.05);border:2px solid rgba(237,240,245,.16);
    border-radius:11px;padding:10px 13px;margin-bottom:8px;
    font-family:'Barlow',sans-serif;font-size:14.5px;font-weight:600;color:#edf0f5;line-height:1.4;
    transition:border-color .15s ease, background .15s ease, color .15s ease, opacity .15s ease;
  }
  .qopt:hover:not(:disabled){border-color:#ffc94d;background:rgba(237,240,245,.1)}
  .qopt:disabled{cursor:default}
  .qopt .ol{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(237,240,245,.1);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:13px}
  .qopt.ok{background:rgba(62,207,148,.15);border-color:#2fa66a;color:#7ce8b8}
  .qopt.miss{background:rgba(255,107,94,.12);border-color:#d1495b;color:#ff9c8a}
  .qopt.dim{opacity:.5}
  .qexp{background:rgba(255,201,77,.08);border:1.5px dashed rgba(255,201,77,.4);border-radius:11px;padding:10px 14px;font-size:13px;font-weight:600;color:rgba(237,240,245,.75);line-height:1.5;margin-bottom:12px}
  .qexp strong{color:#edf0f5}
  .qbtn{font-family:'Bebas Neue';font-size:17px;letter-spacing:.06em;cursor:pointer;width:100%;
    color:#0b0e13;background:linear-gradient(180deg,#ffc94d,#f0a32b);border:none;border-radius:11px;padding:11px;
    box-shadow:0 3px 0 #b97b1e}
  .qbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b97b1e}
  .qstars{display:flex;justify-content:center;gap:6px;font-size:34px;color:#e8a71c;margin:6px 0 10px}
  .qstars .off{opacity:.2;filter:grayscale(1)}
  .qgains{display:flex;gap:8px;margin-bottom:14px}
  .qgains div{flex:1;text-align:center;background:rgba(237,240,245,.05);border:1px solid rgba(237,240,245,.14);border-radius:11px;padding:9px 4px;font-family:'Bebas Neue';font-size:17px;color:#ffc94d}
  .qgains div small{display:block;font-family:'Barlow';font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,240,245,.5)}
</style>
</head>
<body>
  <div id="scene"></div>
  <a class="back" href="index.html">← MAPA</a>
  <div class="hud" id="hudDistrict">CIDADE DO SABER</div>
  <div class="crosshair" hidden id="crosshair"></div>
  <div id="prompt" hidden></div>

  <div class="overlay hidden" id="quizOverlay">
    <div class="card quiz-card" id="quizBody"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1>Cidade do <em>Saber</em></h1>
      <p>Modo 1ª pessoa — ande até a seta/prédio da missão, toque no blip e responda para ganhar estrelas. O progresso é o mesmo do mapa 2D.</p>
      <div class="keys">
        <span>W A S D · setas</span><span>andar</span>
        <span>mouse</span><span>olhar</span>
        <span>Shift</span><span>correr</span>
        <span>Esc</span><span>sair</span>
      </div>
      <button class="btn-go" id="btnEnter">COMEÇAR A EXPLORAR</button>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script src="assets/mascara.js"></script>
  <script src="assets/predios.js"></script>
  <script src="assets/cidade-data.js"></script>
  <script src="questoes/mat.js"></script>
  <script src="questoes/por.js"></script>
  <script src="questoes/cie.js"></script>
  <script src="questoes/his.js"></script>
  <script src="fps.js"></script>
</body>
</html>
